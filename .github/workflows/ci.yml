name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

# Same command the developer runs; CI tracks the active channel via FACTORIO_CHANNEL.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - run: devenv test
        env:
          FACTORIO_CHANNEL: ${{ vars.FACTORIO_CHANNEL }}
